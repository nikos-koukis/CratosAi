# Development authorization policy: which mTLS client identity (the URI SAN
# of its certificate) may call which orchestrator RPC. Anything not listed is
# denied. Production policies are deployed per environment, not from this file.

# Voice gateway: drives one conversation per voice session.
[[principal]]
id = "spiffe://jarvis.local/voice-gateway"
allow = [
  "OpenConversation",
  "RecordTurn",
  "CallTool",
  "AckToolOutput",
  "WatchConversation",
  "AckEvent",
  "CloseConversation",
]

# Dashboard backend: the user's tasks, devices and device approvals.
[[principal]]
id = "spiffe://jarvis.local/dashboard-api"
allow = [
  "GetTask",
  "ListTasks",
  "CancelTask",
  "RegisterDevice",
  "ListDevices",
  "RemoveDevice",
  "SubmitDeviceApproval",
]
