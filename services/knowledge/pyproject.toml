[project]
name = "jarvis-knowledge"
version = "0.1.0"
description = "Jarvis knowledge graph and retrieval service (Neo4j + Qdrant, local embeddings)."
requires-python = ">=3.14,<3.15"
dependencies = [
  "jarvis-proto",
  "cryptography>=50.0.1,<51",
  "grpcio>=1.84.0,<2",
  "grpcio-health-checking>=1.84.0,<2",
  "grpcio-reflection>=1.84.0,<2",
  "grpcio-status>=1.84.0,<2",
  "neo4j>=6.3.1,<7",
  "numpy>=2.5.3,<3",
  "onnxruntime>=1.30.0,<2",
  "prometheus-client>=0.26.0,<1",
  "protobuf>=7.35.1,<8",
  "qdrant-client>=1.19.1,<2",
  "tokenizers>=0.23.2,<1",
]

[project.scripts]
jarvis-knowledge = "jarvis_knowledge.main:main"
knowledgectl = "jarvis_knowledge.cli:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
  "testcontainers==4.15.0",
  "types-grpcio==1.83.0.20260730",
  "types-grpcio-health-checking==1.0.0.20260518",
  "types-grpcio-reflection==1.0.0.20260508",
  "types-grpcio-status==1.0.0.20260408",
  "types-protobuf==7.35.1.20260906",
]

[tool.uv.sources]
jarvis-proto = { workspace = true }

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_knowledge"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "TRY", "BLE", "C4", "PIE", "RET", "PL"]
ignore = [
  "PLR0913",  # gRPC/request plumbing takes many arguments
  "PLR2004",  # limits are named where they matter
  "TRY003",   # messages at the raise site are clearer here
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on Greek text on purpose, and compound asserts read better there.
"tests/**" = ["S101", "PLR0915", "S105", "S106", "RUF001", "PT018"]

[tool.mypy]
strict = true
python_version = "3.14"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "testcontainers.*"]
ignore_missing_imports = true

# googleapis-common-protos ships .pyi files but no py.typed marker.
[[tool.mypy.overrides]]
module = ["google.rpc.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
