[package]
name = "jarvis-vault"
version = "0.1.0"
description = "BYOK Vault: envelope-encrypted storage for tenant-owned LLM provider API keys"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "jarvis-vault"
path = "src/main.rs"

[dependencies]
aes-gcm = { version = "0.11", features = ["zeroize"] }
anyhow = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
jarvis-common = { path = "../../libs/rust/jarvis-common" }
prost = "0.14"
prost-types = "0.14"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate", "macros"] }
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tonic-types = "0.14"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
zeroize = "1.8"

[build-dependencies]
prost = "0.14"
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen = "0.14"
testcontainers-modules = { version = "0.15", features = ["postgres", "blocking"] }
