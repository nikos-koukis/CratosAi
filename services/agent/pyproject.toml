[project]
name = "jarvis-agent"
version = "0.1.0"
description = "Jarvis orchestrator sidecar: LLM reasoning (OpenAI, xAI) and knowledge extraction (LangGraph)."
requires-python = ">=3.14,<3.15"
dependencies = [
  "jarvis-proto",
  "grpcio>=1.84.0,<2",
  "grpcio-health-checking>=1.84.0,<2",
  "grpcio-status>=1.84.0,<2",
  "langgraph>=1.2.12,<2",
  "openai>=3.19.2,<4",
  "prometheus-client>=0.26.0,<1",
  "protobuf>=7.35.1,<8",
  "pydantic>=2.7.4,<3",
]

[project.scripts]
jarvis-agent = "jarvis_agent.main:main"
jarvis-fake-llm = "jarvis_agent.fake_llm:main"

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
  "types-grpcio==1.83.0.20260730",
  "types-grpcio-health-checking==1.0.0.20260518",
  "types-grpcio-status==1.0.0.20260408",
  "types-protobuf==7.35.1.20260906",
]

[tool.uv.sources]
jarvis-proto = { workspace = true }

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_agent"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "TRY", "BLE", "C4", "PIE", "RET", "PL"]
ignore = ["PLR0913", "PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915", "S105", "S106", "RUF001", "PT018"]

[tool.mypy]
strict = true
python_version = "3.14"
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.rpc.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
