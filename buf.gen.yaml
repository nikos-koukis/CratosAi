# Go code generation for /proto (Rust services generate at build time instead).
# Run: pnpm nx run proto:generate. Plugins are pinned in tools/go/go.mod.
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: jarvis.internal/gen/go
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen/go
    opt: paths=source_relative
