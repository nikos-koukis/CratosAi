[package]
name = "jarvis-daemon"
version = "0.1.0"
description = "Jarvis local daemon: runs allowlisted or user-approved commands in the macOS sandbox, reachable over Tailscale"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "jarvisd"
path = "src/main.rs"

[[bin]]
name = "jarvis-approve"
path = "src/bin/jarvis-approve.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
if-addrs = "0.15"
jarvis-common = { path = "../../libs/rust/jarvis-common" }
p256 = { version = "0.14", features = ["ecdsa", "getrandom", "pem", "pkcs8"] }
prost = "0.14"
prost-types = "0.14"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "1"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-reflection = "0.14"
tonic-types = "0.14"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
prost = "0.14"
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen = "0.14"
