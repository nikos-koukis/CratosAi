[workspace]
resolver = "3"
members = ["daemons/mac-daemon", "libs/rust/jarvis-common", "services/vault"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Argon2id and AES are unusably slow unoptimised; keep dev/test builds realistic.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
