# Project Jarvis: local development infrastructure.
#
#   pnpm nx run infra:up      start everything and wait until healthy
#   pnpm nx run infra:test    verify every service accepts authenticated access
#   pnpm nx run infra:down    stop (data is kept)
#   pnpm nx run infra:reset   stop and DELETE all data volumes
#
# Secrets come from deploy/compose/.env, generated by scripts/init-env.sh.
# Every port is published on 127.0.0.1 only, never on the LAN.

name: jarvis

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    <<: *defaults
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing; run deploy/compose/scripts/init-env.sh}
      POSTGRES_DB: postgres
      # initdb otherwise trusts TCP from 127.0.0.1 inside the container. Only
      # the Unix socket (container-internal) stays passwordless.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      # Read by postgres/init (first start and every infra:up).
      VAULT_DB_PASSWORD: ${VAULT_DB_PASSWORD:?missing; run deploy/compose/scripts/init-env.sh}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:?missing; run deploy/compose/scripts/init-env.sh}
      ORCH_DB_PASSWORD: ${ORCH_DB_PASSWORD:?missing; run deploy/compose/scripts/init-env.sh}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?missing; run deploy/compose/scripts/init-env.sh}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:?missing; run deploy/compose/scripts/init-env.sh}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${JARVIS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "--quiet", "--username=postgres", "--dbname=postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Redis-compatible cache: rate limits, sessions, short-lived state.
  dragonfly:
    <<: *defaults
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.2
    ulimits:
      memlock: -1
    environment:
      DFLY_requirepass: ${DRAGONFLY_PASSWORD:?missing; run deploy/compose/scripts/init-env.sh}
    command:
      - dragonfly
      - --logtostderr
      - --dir=/data
      - --maxmemory=512mb
      - --proactor_threads=2
    volumes:
      - dragonfly-data:/data
    ports:
      - "127.0.0.1:${JARVIS_DRAGONFLY_PORT:-56379}:6379"
    healthcheck:
      # The image's built-in check ignores auth; this one proves it works.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$DFLY_requirepass\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Knowledge graph (GraphRAG).
  neo4j:
    <<: *defaults
    image: neo4j:2026.09.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?missing; run deploy/compose/scripts/init-env.sh}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # Published ports differ from the defaults; tell the browser UI where Bolt is.
      NEO4J_server_bolt_advertised__address: localhost:${JARVIS_NEO4J_BOLT_PORT:-57687}
      NEO4J_server_http_advertised__address: localhost:${JARVIS_NEO4J_HTTP_PORT:-57474}
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    ports:
      - "127.0.0.1:${JARVIS_NEO4J_HTTP_PORT:-57474}:7474"
      - "127.0.0.1:${JARVIS_NEO4J_BOLT_PORT:-57687}:7687"
    healthcheck:
      # Plain HTTP probe; the image has no curl and cypher-shell starts a JVM.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/7474 &&
          printf 'GET / HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Vector store (semantic retrieval).
  qdrant:
    <<: *defaults
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?missing; run deploy/compose/scripts/init-env.sh}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${JARVIS_QDRANT_HTTP_PORT:-56333}:6333"
      - "127.0.0.1:${JARVIS_QDRANT_GRPC_PORT:-56334}:6334"
    healthcheck:
      # /readyz is exempt from the API key; the image has no curl.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
  dragonfly-data:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
